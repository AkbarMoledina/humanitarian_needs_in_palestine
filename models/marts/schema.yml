version: 2

models:
  - name: aid_events
    description: "Mart table providing a comprehensive view of aid events with date and crossing details. Designed for direct analysis of aid flows by cargo category and border crossing over time. Uses LEFT JOIN from dim_date to include all dates in the date range, even when no aid events occurred."

    columns:
      - name: aid_event_id
        description: "Primary key identifying the aid event (NULL for dates with no aid events)"
        tests:
          - unique

      - name: date_id
        description: "Foreign key to dim_date (NULL for dates with no aid events)"
        tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id

      - name: full_date
        description: "Full date of the aid event"
        tests:
          - not_null

      - name: year
        description: "Year of the aid event"
        tests:
          - not_null

      - name: week_of_year
        description: "Week number within the year"
        tests:
          - not_null

      - name: number_of_trucks
        description: "Number of trucks in the aid convoy (NULL for dates with no aid events)"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

      - name: items
        description: "Description of cargo items"

      - name: cargo_category
        description: "Category of cargo (e.g., Food, Medical, Water)"

      - name: quantity
        description: "Quantity of items"

      - name: units
        description: "Unit of measurement for quantity"

      - name: donation_type
        description: "Type of donation"

      - name: crossing_id
        description: "Foreign key to dim_crossing"

      - name: crossing_name
        description: "Name of the border crossing point"

      - name: data_period
        description: "Time period the data covers"

      - name: last_edited
        description: "Timestamp of last data edit"

  - name: commodity_price_trends
    description: "Mart table exposing price observations over time for trend analysis, visualization, and index construction. Joins commodity prices with dimension tables for analysis-ready output."

    columns:
      - name: commodity_id
        description: "Foreign key to dim_commodity"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_commodity')
                field: commodity_id

      - name: commodity_name
        description: "Name of the commodity"
        tests:
          - not_null

      - name: unit_amount
        description: "Unit of measurement and quantity"
        tests:
          - not_null

      - name: commodity_category
        description: "Category assigned to the commodity"
        tests:
          - not_null

      - name: date_id
        description: "Foreign key to dim_date"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id

      - name: full_date
        description: "Full date of the price observation"
        tests:
          - not_null

      - name: price_year
        description: "Year of the price observation"
        tests:
          - not_null

      - name: price_month
        description: "Month name of the price observation"
        tests:
          - not_null

      - name: price
        description: "Commodity price on the given date"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

  - name: commodity_price_change_from_baseline
    description: "Mart table calculating percentage change relative to October 2023 baseline price. Used for measuring inflationary pressure and comparing relative price shocks across commodities."

    columns:
      - name: commodity_name
        description: "Name of the commodity"
        tests:
          - not_null

      - name: unit_amount
        description: "Unit of measurement and quantity"
        tests:
          - not_null

      - name: commodity_category
        description: "Category assigned to the commodity"
        tests:
          - not_null

      - name: full_date
        description: "Full date of the price observation"
        tests:
          - not_null

      - name: month_name
        description: "Month name of the price observation"
        tests:
          - not_null

      - name: year
        description: "Year of the price observation"
        tests:
          - not_null

      - name: baseline_price
        description: "Baseline price from October 2023 (2023-10-01)"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

      - name: price
        description: "Actual price on the given date"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

      - name: pct_change_from_baseline
        description: "Percentage change from baseline price, calculated as ((price - baseline) / baseline) * 100"

    tests:
      - dbt_utils.expression_is_true:
          name: baseline_date_check
          description: "Ensures all records are after the baseline date"
          arguments:
            expression: "full_date > '2023-10-01'"

  - name: funding_analysis
    description: "Mart table analyzing funding projects with calculated funding status categories. Provides insight into funding requirements, actual funding received, and overall funding health."

    columns:
      - name: id
        description: "Project identifier (may be NULL for summary rows)"
        tests:
          - unique

      - name: name
        description: "Project name"

      - name: code
        description: "Project code"

      - name: type_id
        description: "Type identifier for the project"

      - name: type_name
        description: "Type name of the project"

      - name: start_date
        description: "Project start date"

      - name: end_date
        description: "Project end date"

      - name: year
        description: "Project year"
        tests:
          - not_null

      - name: requirements_usd
        description: "Funding requirements in USD (stored as VARCHAR in source)"

      - name: funding_usd
        description: "Actual funding received in USD (stored as VARCHAR in source)"

      - name: funding_pct
        description: "Percentage of funding received relative to requirements"

      - name: funding_status
        description: "Categorized funding status based on funding percentage"
        tests:
          - accepted_values:
              arguments:
                values:
                  - "Fully Funded"
                  - "Partially Funded"
                  - "Severely Underfunded"