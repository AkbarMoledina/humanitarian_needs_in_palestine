version: 2

models:
  - name: fct_aid_received
    description: "Fact table of aid received"
    config:
      contract:
        enforced: true
      on_schema_change: fail

    columns:
    - name: aid_event_id
      data_type: BIGINT
      description: "Primary key for the aid event"
      tests:
        - not_null
        - unique

    - name: date_id
      data_type: INTEGER
      description: "Foreign key to dim_date"
      tests:
        - not_null
        - relationships:
            arguments:
              to: ref('dim_date')
              field: date_id
        - dbt_utils.accepted_range:
            arguments:
              min_value: 20231001
              inclusive: true

    - name: number_of_trucks
      data_type: INTEGER
      description: "Number of trucks in the aid event"
      tests:
        - not_null
        - dbt_utils.accepted_range:
            arguments:
              min_value: 0
              inclusive: false

    - name: cargo_id
      data_type: VARCHAR
      description: "Foreign key to dim_cargo"
      tests:
        - not_null
        - relationships:
            arguments:
              to: ref('dim_cargo')
              field: cargo_id

    - name: quantity
      data_type: INTEGER
      description: "Quantity of cargo received"
      tests:
        - not_null
        - dbt_utils.accepted_range:
            arguments:
              min_value: 0
              inclusive: true

    - name: units
      data_type: VARCHAR
      description: "Units of measurement for the cargo quantity"

    - name: crossing_id
      data_type: VARCHAR
      description: "Foreign key to dim_crossing"
      tests:
        - relationships:
            arguments:
              to: ref('dim_crossing')
              field: crossing_id

    - name: data_period
      data_type: VARCHAR
      description: "Data period of the aid event"

    - name: last_edited
      data_type: TIMESTAMP
      description: "Timestamp of the last edit to the aid event record"

    - name: processed_date
      data_type: TIMESTAMPTZ
      description: "Timestamp with time zone of when the record was processed"


  - name: fct_commodity_prices
    description: "Fact table of commodity prices over time, with baseline comparison"
    config:
      contract:
        enforced: true
      on_schema_change: fail

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - commodity_id
              - date_id

    columns:
      - name: commodity_id
        data_type: VARCHAR
        description: "Foreign key to dim_commodity"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_commodity')
                field: commodity_id

      - name: date_id
        data_type: INTEGER
        description: "Foreign key to dim_date"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id

      - name: price
        data_type: DOUBLE
        description: "Commodity price on the given date"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

      - name: processed_date
        data_type: TIMESTAMPTZ
        description: "Timestamp with time zone of when the record was processed"
